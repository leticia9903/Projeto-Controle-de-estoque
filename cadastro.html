
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Estoque Escolar</title>

    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="icon" type="image/png" href="/icon_estoque.png">
    <script src="js/cadastro.js" defer></script>
</head>
<body>

    <main class="container">
        <section class="cartao-cadastro">

            <header class="cabecalho">
                <div class="logo">E</div>
                <h1>Estoque Escolar</h1>
                <p>Controle de materiais escolares</p>
            </header>

            <div class="introducao">
                <h2>Criar uma conta</h2>
                <p>Preencha os dados para acessar o sistema.</p>
            </div>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@escola.com"
                        autocomplete="email"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small>A senha deve ter pelo menos 8 caracteres.</small>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div id="mensagem" class="mensagem" role="status"></div>

                <button type="submit" id="btnCadastrar">
                    Criar conta
                </button>

            </form>

            <p class="link-login">
                Já possui uma conta?
                <a href="index.html">Entrar no sistema</a>
            </p>

        </section>
    </main>

</body>
</html>
